name: stockmanager
description: Offline-first stock manager for SMEs and retail stores.
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ">=3.2.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.2
  path: ^1.8.3
  intl: ^0.19.0
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  share_plus: ^7.2.2
  mobile_scanner: 4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.3.2+1

flutter:
  uses-material-design: true
